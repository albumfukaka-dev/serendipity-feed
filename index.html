<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F5F0EB">
    <meta name="description" content="AI 策展的跨领域探索信息流，替代算法推送，提供意外之喜">
    <title>意外之喜</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header class="header" id="mainHeader">
        <div class="header-left">
            <span class="header-title">意外之喜</span>
            <span class="header-progress" id="progressBadge"></span>
        </div>
        <span class="header-counter" id="counter"></span>
    </header>

    <div class="feed-container" id="feed"></div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="navExplore" onclick="showFeed()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg>
            探索
        </button>
        <button class="nav-btn" id="navShuffle" onclick="shuffleFeed()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            换一批
        </button>
        <button class="nav-btn" id="navSaved" onclick="toggleSaved()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            收藏 <span id="savedCount"></span>
        </button>
    </nav>

    <!-- Saved Panel -->
    <div class="saved-panel" id="savedPanel">
        <div class="saved-panel-header">
            <span class="saved-panel-title">已收藏</span>
            <div class="saved-panel-actions">
                <button class="export-btn" onclick="exportToMarkdown()" title="导出到 Markdown">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    导出
                </button>
                <button class="close-btn" onclick="toggleSaved()">✕</button>
            </div>
        </div>
        <div id="savedList"></div>
    </div>

    <!-- Deep Dive Panel -->
    <div class="deepdive-panel" id="deepdivePanel">
        <div class="deepdive-content" id="deepdiveContent">
            <button class="deepdive-close" onclick="closeDeepDive()">✕</button>
            <div id="deepdiveBody"></div>
        </div>
    </div>

    <!-- Export Toast -->
    <div class="toast" id="toast"></div>

    <script src="data.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
